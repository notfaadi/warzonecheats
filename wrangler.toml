# CI Workers Builds project name (repo: warzonecheats)
name = "warzonecheats"
compatibility_date = "2026-01-01"
main = "src/worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Run Worker first so www/http → https://warzonecheats.co 301s always apply
run_worker_first = true

[build]
command = "npm run build"

# Custom Domains are exact-host. Apex-only never receives www — Seobility then
# scores Server 0% (“uses both www and non-www”). Bind both so the Worker 301s.
# Zone routes (/*) match valohacks production: traffic hits this Worker even
# when a hostname is already on the zone but not yet a dedicated custom domain.
[[routes]]
pattern = "warzonecheats.co"
custom_domain = true

[[routes]]
pattern = "www.warzonecheats.co"
custom_domain = true

[[routes]]
pattern = "warzonecheats.co/*"
zone_name = "warzonecheats.co"

[[routes]]
pattern = "www.warzonecheats.co/*"
zone_name = "warzonecheats.co"
